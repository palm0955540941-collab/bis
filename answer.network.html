<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>เฉลยข้อสอบ: เครือข่ายคอมพิวเตอร์ - HOKKADEE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root {
  --bg-body: #0a0a0a;
  --bg-surface: #0d0d0d;
  --bg-card: #111111;
  --bg-elevated: #141414;
  --bg-elevated-2: #1a1a1a;
  --border: #2a2a2a;
  --border-soft: #1a1a1a;
  --border-accent: #3a3a3a;
  --text: #e0e0e0;
  --text-muted: #999999;
  --text-muted-3: #777777;
  --text-muted-4: #666666;
  --text-muted-5: #555555;
  --accent: #ffd700;
  --accent-dark: #ffaa00;
  --accent-soft: rgba(255, 215, 0, 0.06);
  --accent-med: rgba(255, 215, 0, 0.12);
  --danger: #ff4444;
  --success: #00cc00;
  --success-bg: #0d3d0d;
  --shadow: rgba(0, 0, 0, 0.3);
  --shadow-accent: rgba(255, 215, 0, 0.12);
  --text-on-accent: #0a0a0a;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'Kanit', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg-body);
  color: var(--text);
  line-height: 1.7;
  min-height: 100vh;
}

.navbar {
  background: var(--bg-surface);
  padding: 0 20px;
  padding-top: env(safe-area-inset-top, 0px);
  position: sticky;
  top: 0;
  z-index: 160;
  border-bottom: 1px solid var(--border);
}
.nav-container {
  max-width: 1200px;
  margin: 0 auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
  height: 64px;
}
.nav-logo { display: flex; align-items: center; text-decoration: none; }
.nav-logo-img { height: 42px; width: auto; }
.nav-logo-img:hover { opacity: 0.85; }
.nav-links { display: flex; align-items: center; gap: 4px; }
.nav-links a {
  color: var(--text-muted);
  text-decoration: none;
  padding: 8px 16px;
  font-size: 0.9rem;
  font-weight: 600;
  transition: color 0.2s, background 0.2s;
  border-radius: 8px;
}
.nav-links a:hover { color: var(--accent); background: var(--accent-soft); }
.nav-links a.active { color: var(--accent); background: rgba(255, 215, 0, 0.1); }

.nav-toggle {
  display: none;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  gap: 5px;
  width: 44px;
  height: 44px;
  background: none;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  z-index: 170;
}
.nav-toggle span {
  display: block;
  width: 22px;
  height: 2px;
  background: var(--text-muted);
  border-radius: 2px;
  transition: all 0.3s ease;
}
.nav-toggle.active span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
.nav-toggle.active span:nth-child(2) { opacity: 0; }
.nav-toggle.active span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }

@media (max-width: 768px) {
  .nav-toggle { display: flex; }
  .nav-links {
    display: none;
    position: absolute;
    top: 100%;
    left: 0;
    right: 0;
    flex-direction: column;
    background: var(--bg-surface);
    border-bottom: 1px solid var(--border);
    padding: 8px 20px 20px;
    box-shadow: 0 8px 24px var(--shadow);
    gap: 2px;
    z-index: 160;
  }
  .nav-links.open { display: flex; }
  .nav-links a { padding: 14px 16px; min-height: 44px; display: flex; align-items: center; font-size: 0.95rem; border-radius: 10px; }
}

.container {
  max-width: 850px;
  margin: 30px auto;
  padding: 30px 20px;
  padding-bottom: calc(30px + env(safe-area-inset-bottom, 0px));
}

.section-title {
  text-align: center;
  font-size: 1.8rem;
  color: var(--accent);
  letter-spacing: 2px;
  margin-bottom: 8px;
}
.section-line {
  width: 60px;
  height: 3px;
  background: var(--accent);
  margin: 0 auto 32px;
  border-radius: 2px;
}

.question-block {
  margin-bottom: 28px;
  padding: 24px 28px;
  background: linear-gradient(145deg, var(--bg-card), var(--bg-surface));
  border: 1px solid var(--border);
  border-radius: 14px;
  border-left: 4px solid var(--accent);
  transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s;
}
.question-block:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 24px var(--shadow-accent);
  border-color: rgba(255, 215, 0, 0.3);
}

.question-title {
  font-weight: 700;
  font-size: 1rem;
  margin-bottom: 16px;
  color: var(--accent);
  line-height: 1.6;
}

.options label {
  display: flex;
  align-items: center;
  gap: 10px;
  margin: 10px 0;
  cursor: pointer;
  padding: 12px 16px;
  border-radius: 10px;
  background: var(--bg-surface);
  border: 1px solid var(--border);
  transition: all 0.2s ease;
  color: var(--text);
  font-size: 0.95rem;
}
.options label:hover {
  background: var(--accent-soft);
  border-color: rgba(255, 215, 0, 0.3);
}
.options label.correct-answer {
  background: rgba(0, 204, 0, 0.1);
  border-color: rgba(0, 204, 0, 0.4);
  color: #6bcb77;
  font-weight: 600;
}
.options label.correct-answer::after {
  content: '✓';
  margin-left: auto;
  font-size: 1.2rem;
  font-weight: 800;
  color: #6bcb77;
  flex-shrink: 0;
}
.options label.wrong-selected {
  background: rgba(255, 68, 68, 0.1);
  border-color: rgba(255, 68, 68, 0.4);
  color: #ff6b6b;
}

input[type="radio"] {
  width: 18px;
  height: 18px;
  cursor: pointer;
  accent-color: var(--accent);
  flex-shrink: 0;
}

.feedback {
  margin-top: 16px;
  padding: 14px 18px;
  border-radius: 10px;
  display: none;
  font-size: 0.92rem;
  line-height: 1.6;
}
.correct {
  background: var(--success-bg);
  color: #6bcb77;
  border: 1px solid rgba(0, 204, 0, 0.3);
}
.incorrect {
  background: rgba(255, 68, 68, 0.1);
  color: #ff6b6b;
  border: 1px solid rgba(255, 68, 68, 0.25);
}

.buttons {
  text-align: center;
  margin-top: 40px;
  display: flex;
  gap: 12px;
  justify-content: center;
  flex-wrap: wrap;
}
button {
  padding: 14px 36px;
  font-size: 1rem;
  cursor: pointer;
  border: none;
  border-radius: 12px;
  font-weight: 700;
  transition: all 0.2s;
  font-family: 'Kanit', sans-serif;
}
button:active { transform: scale(0.96); }

#submit-btn {
  background: linear-gradient(135deg, var(--accent), var(--accent-dark));
  color: var(--text-on-accent);
  box-shadow: 0 4px 15px rgba(255, 215, 0, 0.3);
}
#submit-btn:hover { box-shadow: 0 8px 25px rgba(255, 215, 0, 0.5); }

#reset-btn {
  background: var(--bg-elevated-2);
  color: var(--text);
  border: 1px solid var(--border);
  display: none;
}
#reset-btn:hover { border-color: var(--accent); }

#result-summary {
  text-align: center;
  font-size: 1.6em;
  font-weight: 800;
  margin-top: 24px;
  color: var(--accent);
  text-shadow: 0 0 30px rgba(255, 215, 0, 0.15);
}

@media (max-width: 768px) {
  .container { padding: 20px 16px; }
  .section-title { font-size: 1.4rem; }
  .question-block { padding: 18px 20px; }
  .options label { padding: 10px 14px; font-size: 0.9rem; }
  #result-summary { font-size: 1.3em; }
}
@media (max-width: 480px) {
  .container { padding: 16px 12px; }
  .question-block { padding: 14px 16px; }
  .question-title { font-size: 0.92rem; }
  .options label { padding: 10px 12px; font-size: 0.85rem; }
  button { padding: 12px 24px; font-size: 0.95rem; }
}
</style>
</head>

<div class="container">
  <h1 class="section-title">เฉลยข้อสอบวิชาเครือข่ายคอมพิวเตอร์</h1>
  <div class="section-line"></div>

  <div id="quiz-container"></div>
  <div id="result-summary"></div>

  <div class="buttons">
    <button id="submit-btn" onclick="submitQuiz()">ส่งคำตอบ</button>
    <button id="reset-btn" onclick="resetQuiz()">ทำใหม่อีกครั้ง</button>
  </div>
</div>

<script>
const quizData = [
  // ==========================================
  // ข้อสอบบทที่ 1 (20 ข้อ)
  // ==========================================
  {
    question: "1. การนำคอมพิวเตอร์หลายๆ เครื่องเชื่อมต่อเข้าด้วยกัน ก่อให้เกิดผลตามข้อใด",
    options: ["Computer Network", "Client", "Server", "Hub"],
    answer: 0,
    explanation: "การเชื่อมต่อคอมพิวเตอร์หลายเครื่องเข้าด้วยกันคือความหมายของ Computer Network"
  },
  {
    question: "2. ข้อใดต่อไปนี้ มิได้จัดอยู่ในส่วนประกอบของระบบการสื่อสารข้อมูล",
    options: ["Message", "Protocol", "Hacker", "Sender/Receiver"],
    answer: 2,
    explanation: "Hacker ไม่ใช่ส่วนประกอบของระบบการสื่อสารข้อมูล (ส่วนประกอบหลักคือ Message, Sender, Receiver, Medium, Protocol)"
  },
  {
    question: "3. โพรโทคอล (Protocol) ตรงกับความหมายตามข้อใด",
    options: ["รูปแบบการเขียนภาษาคอมพิวเตอร์", "สื่อกลางที่นำมาใช้สำหรับสื่อสาร", "กฎเกณฑ์หรือข้อตกลงที่นำมาใช้สื่อสาร", "รูปแบบการเชื่อมต่อเครือข่าย"],
    answer: 2,
    explanation: "Protocol คือกฎเกณฑ์และข้อตกลงที่ใช้ในการสื่อสารข้อมูลบนเครือข่าย"
  },
  {
    question: "4. โพรโทคอล สามารถนำไปเทียบเคียงกับข้อใด",
    options: ["หน่วยความจำ", "ภาษาที่ใช้สื่อสารกัน", "คอมไพเลอร์", "ถูกทั้งข้อ ข. และ ค."],
    answer: 1,
    explanation: "เปรียบเสมือน 'ภาษา' ที่คอมพิวเตอร์ใช้คุยกันเพื่อให้เข้าใจตรงกัน"
  },
  {
    question: "5. ข่าวสารที่สื่อสารกันบนเครือข่าย จะถูกลำเลียงผ่านสิ่งใด",
    options: ["สายสัญญาณ", "คลื่นวิทยุ", "สื่อกลางส่งข้อมูล", "เป็นไปได้ทุกข้อ"],
    answer: 2,
    explanation: "ถูกลำเลียงผ่าน 'สื่อกลางส่งข้อมูล' (Medium) ซึ่งอาจเป็นแบบมีสายหรือไร้สายก็ได้"
  },
  {
    question: "6. คุณสมบัติ 4 ประการของระบบการสื่อสารข้อมูล ประกอบด้วยอะไรบ้าง",
    options: ["Delivery, Accuracy, Source, Destination", "Message, Sender, Receiver, Protocol", "Delivery, Accuracy, Timeliness, Jitter", "ผิดทุกข้อ"],
    answer: 2,
    explanation: "คุณสมบัติที่ดีต้องมีการส่งมอบตรงจุด (Delivery), แม่นยำ (Accuracy), ทันเวลา (Timeliness) และความหน่วงคงที่ (Jitter)"
  },
  {
    question: "7. การสนทนากันผ่านโทรศัพท์ จัดเป็นการสื่อสารที่เป็นไปตามทิศทางการไหลของข้อมูลตามข้อใด",
    options: ["Simplex", "Half-Duplex", "Multiplex", "Full-Duplex"],
    answer: 3,
    explanation: "โทรศัพท์เป็นการสื่อสารแบบ 2 ทางพร้อมกัน จึงเป็น Full-Duplex"
  },
  {
    question: "8. อุปกรณ์โทรคมนาคมตามข้อใด ที่ประเทศไทยได้ยกเลิกการบริการแล้ว",
    options: ["โทรเลข", "โทรสาร", "โทรศัพท์", "โทรทัศน์"],
    answer: 0,
    explanation: "โทรเลข (Telegraph) เป็นบริการที่ถูกยกเลิกไปแล้วในประเทศไทย"
  },
  {
    question: "9. จากข้อที่ 8 อุปกรณ์โทรคมนาคมดังกล่าวสามารถเทียบเคียงได้กับเทคโนโลยีใดในปัจจุบัน",
    options: ["LAN", "SMS", "Pager", "ถูกทั้งข้อ ข. และ ค."],
    answer: 3,
    explanation: "โทรเลขเป็นการส่งข้อความสั้นๆ ซึ่งเทียบเคียงได้กับเทคโนโลยี SMS และ Pager"
  },
  {
    question: "10. Line-of-sight เกี่ยวข้องกับการสื่อสารตามข้อใด",
    options: ["Telephone", "Microwave", "Radio", "Infrared"],
    answer: 1,
    explanation: "คลื่นไมโครเวฟ (Microwave) ต้องอาศัยการส่งสัญญาณแบบเส้นตรงในระดับสายตา (Line-of-sight)"
  },
  {
    question: "11. ก่อนที่จะมีเครือข่าย การขอคัดลอกข้อมูลจากส่วนงานอื่นๆ เพื่อนำมาใช้งาน เรียกว่าอะไร",
    options: ["Snookernet", "Sneakernet", "Internet", "LAN"],
    answer: 1,
    explanation: "การเดินถือแผ่นดิสก์หรือแฟลชไดร์ฟไปก๊อปปี้ข้อมูลด้วยตัวเองเรียกว่า Sneakernet"
  },
  {
    question: "12. ข้อใดต่อไปนี้ มิใช่ประโยชน์ของเครือข่าย",
    options: ["การแบ่งปันการใช้งานทรัพยากรร่วมกัน", "ช่วยลดค่าใช้จ่าย", "คอมพิวเตอร์ทำงานได้รวดเร็วขึ้น", "ทำให้สื่อสารได้สะดวกยิ่งขึ้น"],
    answer: 2,
    explanation: "เครือข่ายไม่ได้ทำให้เครื่องคอมพิวเตอร์แต่ละเครื่องประมวลผลได้รวดเร็วขึ้นโดยตรง"
  },
  {
    question: "13. เวลาที่ใช้ขนส่งข้อมูลและเวลาตอบสนอง เป็นเกณฑ์วัดประสิทธิภาพของเครือข่ายตามข้อใด",
    options: ["Performance", "Reliability", "Security", "Recovery"],
    answer: 0,
    explanation: "เวลาการขนส่ง (Transit time) และเวลาตอบสนอง (Response time) เป็นตัววัดด้านประสิทธิภาพ (Performance)"
  },
  {
    question: "14. กรณีเครือข่ายล่ม แล้วสามารถกู้คืนระบบได้อย่างรวดเร็ว ตรงกับเกณฑ์วัดประสิทธิภาพของเครือข่ายตามข้อใด",
    options: ["Performance", "Reliability", "Security", "Recovery"],
    answer: 1,
    explanation: "ความสามารถในการกู้คืนระบบแสดงถึงความน่าเชื่อถือและเสถียรภาพ (Reliability) ของเครือข่าย"
  },
  {
    question: "15. ข้อใดต่อไปนี้ คือวัตถุประสงค์ของมาตรฐาน",
    options: ["เพื่อให้อุปกรณ์สามารถส่งสัญญาณไปยังอุปกรณ์อื่นๆ ได้", "เพื่อให้อุปกรณ์ต่างๆ สามารถใช้งานเข้ากันได้ และเชื่อมต่อระหว่างกันได้", "เพื่อสร้างความมั่นใจถึงสื่อกลางที่สามารถทำงานเฉพาะด้านได้", "ถูกทุกข้อ"],
    answer: 3,
    explanation: "มาตรฐานถูกสร้างขึ้นเพื่อให้ฮาร์ดแวร์และซอฟต์แวร์จากต่างผู้ผลิตสามารถทำงานร่วมกันได้อย่างสมบูรณ์"
  },
  {
    question: "16. กรณีบริษัท IBM ได้กำหนดมาตรฐานขึ้นมาเพื่อใช้งานบนเครือข่ายของ IBM เอง จัดอยู่ในมาตรฐานตามข้อใด",
    options: ["OSI Model", "De Facto", "De Jure", "ถูกทั้งข้อ ก. และ ข."],
    answer: 1,
    explanation: "มาตรฐานที่ถูกกำหนดโดยผู้ผลิตรายใดรายหนึ่งและใช้กันอย่างแพร่หลายโดยพฤตินัย เรียกว่า De Facto"
  },
  {
    question: "17. องค์กรตามข้อใด กำกับดูแลมาตรฐานเครือข่ายท้องถิ่น",
    options: ["ISO", "ITU-T", "ANSI", "IEEE"],
    answer: 3,
    explanation: "IEEE (Institute of Electrical and Electronics Engineers) เป็นผู้กำหนดมาตรฐานเครือข่าย LAN (เช่น IEEE 802.3 สำหรับ Ethernet)"

const quizContainer = document.getElementById('quiz-container');
const resultSummary = document.getElementById('result-summary');
const submitBtn = document.getElementById('submit-btn');
const resetBtn = document.getElementById('reset-btn');

function loadQuiz() {
  quizContainer.innerHTML = '';
  quizData.forEach((q, index) => {
    const questionBlock = document.createElement('div');
    questionBlock.className = 'question-block';

    const questionTitle = document.createElement('div');
    questionTitle.className = 'question-title';
    questionTitle.textContent = q.question;
    questionBlock.appendChild(questionTitle);

    const optionsDiv = document.createElement('div');
    optionsDiv.className = 'options';
    q.options.forEach((opt, optIndex) => {
      const label = document.createElement('label');
      const radio = document.createElement('input');
      radio.type = 'radio';
      radio.name = 'question' + index;
      radio.value = optIndex;
      label.appendChild(radio);
      label.appendChild(document.createTextNode(' ' + opt));
      if (optIndex === q.answer) {
        label.classList.add('correct-answer');
      }
      optionsDiv.appendChild(label);
    });
    questionBlock.appendChild(optionsDiv);

    const feedbackDiv = document.createElement('div');
    feedbackDiv.className = 'feedback';
    feedbackDiv.id = 'feedback' + index;
    questionBlock.appendChild(feedbackDiv);

    quizContainer.appendChild(questionBlock);
  });
}

function submitQuiz() {
  let score = 0;
  let allAnswered = true;

  quizData.forEach((q, index) => {
    const selected = document.querySelector(`input[name="question${index}"]:checked`);
    const feedbackDiv = document.getElementById('feedback' + index);

    if (!selected) {
      allAnswered = false;
      return;
    }

    const selectedValue = parseInt(selected.value);
    feedbackDiv.style.display = 'block';

    if (selectedValue === q.answer) {
      score++;
      feedbackDiv.textContent = 'ถูกต้องครับ!';
      feedbackDiv.className = 'feedback correct';
    } else {
      feedbackDiv.textContent = 'ผิดครับ - ' + q.explanation;
      feedbackDiv.className = 'feedback incorrect';
      const labels = document.querySelectorAll(`input[name="question${index}"]`);
      labels.forEach(r => {
        if (parseInt(r.value) === selectedValue) r.parentElement.classList.add('wrong-selected');
      });
    }

    const radios = document.querySelectorAll(`input[name="question${index}"]`);
    radios.forEach(radio => radio.disabled = true);
  });

  if (!allAnswered) {
    alert('กรุณาตอบคำถามให้ครบทุกข้อก่อนส่งคำตอบครับ');
    return;
  }

  resultSummary.textContent = 'คุณทำได้ ' + score + ' / ' + quizData.length + ' คะแนน';
  submitBtn.style.display = 'none';
  resetBtn.style.display = 'inline-block';
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function resetQuiz() {
  loadQuiz();
  resultSummary.textContent = '';
  submitBtn.style.display = 'inline-block';
  resetBtn.style.display = 'none';
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

loadQuiz();
</script>

<script>
document.querySelector('.nav-toggle').addEventListener('click', function() {
  const nav = document.querySelector('.nav-links');
  nav.classList.toggle('open');
  this.classList.toggle('active');
  this.setAttribute('aria-expanded', nav.classList.contains('open'));
});
document.querySelectorAll('.nav-links a').forEach(function(link) {
  link.addEventListener('click', function() {
    document.querySelector('.nav-links').classList.remove('open');
    document.querySelector('.nav-toggle').classList.remove('active');
    document.querySelector('.nav-toggle').setAttribute('aria-expanded', 'false');
  });
});
</script>
